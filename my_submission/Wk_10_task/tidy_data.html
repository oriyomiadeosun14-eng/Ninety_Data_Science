      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

zation reveals the momentum and risk profiles of the strategies:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EVolatility: You will notice the Pro Selection line shows the most aggressive movement. While it offers high peaks, it also carries deeper valleys, highlighting the risk of active management.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EMarket Synchronization: The plot clearly shows how all three strategies\u2014even the random ones\u2014are heavily influenced by the overall movement of the Dow Jones, suggesting that market-wide trends are often stronger than individual stock-picking expertise.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E3. The \"Spread\" Summary\u003C/strong\u003E\nFollowing the visual analysis, I have provided a Pivoted Summary Table. This table \"spreads\" the Dow Jones returns across a grid of months and years, allowing for a quick, precise audit of performance at any specific point in the six-year timeline.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "3d50068efd2cb3b60d213f5a771c214e", "console": [], "id": "ZuKs", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ZuKs-0' random-id='e1889499-79b7-1e76-a456-201ccffa06cf'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;month\u0026#92;\u0026quot;:\u0026#92;\u0026quot;January\u0026#92;\u0026quot;,\u0026#92;\u0026quot;1990\u0026#92;\u0026quot;:null,\u0026#92;\u0026quot;1991\u0026#92;\u0026quot;:-0.8,\u0026#92;\u0026quot;1992\u0026#92;\u0026quot;:6.5,\u0026#92;\u0026quot;1993\u0026#92;\u0026quot;:-0.8,\u0026#92;\u0026quot;1994\u0026#92;\u0026quot;:11.2,\u0026#92;\u0026quot;1995\u0026#92;\u0026quot;:1.8,\u0026#92;\u0026quot;1996\u0026#92;\u0026quot;:15.0,\u0026#92;\u0026quot;1997\u0026#92;\u0026quot;:19.6,\u0026#92;\u0026quot;1998\u0026#92;\u0026quot;:-0.3},{\u0026#92;\u0026quot;month\u0026#92;\u0026quot;:\u0026#92;\u0026quot;February\u0026#9
