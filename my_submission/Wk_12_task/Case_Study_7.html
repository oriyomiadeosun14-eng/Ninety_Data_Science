      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

03Ch2 id=\"3-count-words-between-savior-name-references\"\u003E3. Count words between Savior name references\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Ere\u003C/code\u003E is Python's regex module. We sort names longest-first so multi-word names\n(e.g. \u003Cem\u003E\"Lord Jesus Christ\"\u003C/em\u003E) match before their subsets (e.g. \u003Cem\u003E\"Lord\"\u003C/em\u003E), then join\nthem with \u003Ccode\u003E|\u003C/code\u003E into a single pattern. Splitting the full text on every match gives\nus the text between each pair of references \u2014 the words in each piece are the gap.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "015114b809c4aa0f8ef49084b7a14908", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "26c848fdede4baefe494bb62b51852b7", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"4-result-average-words-between-savior-name-references\"\u003E4. Result \u2014 average words between Savior name references\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2558b11b634e0aed90bed7e6ff10a6a6", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"average-2554-words\"\u003E\u003Cstrong\u003EAverage: 25.54 words\u003C/strong\u003E\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EMedian: \u003Cstrong\u003E17\u003C/strong\u003E words \u0026nbsp;\u2022\u0026nbsp; Min: \u003Cstrong\u003E0\u003C/strong\u003E \u0026nbsp;\u2022\u0026nbsp; Max: \u003Cstrong\u003E557\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2a91ad2fe18846bf83b478864d504f66", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"5-distribution-of-word-gaps\"\u003E5. Distribution of word gaps\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "18d48f5baedb2db29ee858717162afa6", "console": [], "id": "emfo", "outputs": [{"data": {"text/html": "            \u003Ciframe src='about:blank' style='border:none !important;' width='700' height='400' srcdoc=\"\u0026lt;html lang=\u0026quot;en\u0026quot;\u003E\n   \u0026lt;head\u003E\n       \u0026lt;meta charset=\u0026quot;UTF-8\u0026quot;\u003E\n       \u0026lt;style\u003E html, body { margin: 0; padding: 0; overflow: hidden; } \u0026lt;/style\u003E\n       \u0026lt;script type=\u0026quot;text/javascript\u0026quot; data-lets-plot-script=\u0026quot;library\u0026quot; src=\u0026quot;https://cdn.jsdelivr.net/gh/JetBrains/lets-plot@v4.9.0/js-package/distr/lets-plot.min.js\u0026quot;\u003E\u0026lt;/script\u003E\n   \u0026lt;/head\u003E\n   \u0026lt;body\u003E\n          \u0026lt;div id=\u0026quot;6jtUIF\u0026quot; \u003E\u0026lt;/div\u003E\n   \u0026lt;script type=\u0026quot;text/javascript\u0026quot; data-lets-plot-script=\u0026quot;plot\u0026quot;\u003E\n   \n   (function() {\n   // ----------\n   \n   const forceImmediateRender = false;\n   const responsive = false;\n   \n   let sizing = {\n       width_mode: \u0026quot;FIXED\u0026quot;,\n       height_mode: \u0026quot;FIXED\u0026quot;,\n       width: 700.0, \n       height: 400.0 \n   };\n   \n   const preferredWidth = document.body.dataset.letsPlotPreferredWidth;\n   if (preferredWidth !== undefined) {\n       sizing = {\n           width_mode: 'FIXED',\n           height_mode: 'SCALED',\n           width: parseFloat(preferredWidth)\n       };\n   }\n   \n   const containerDiv = document.getElementById(\u0026quot;6jtUIF\u0026quot;);\n   let fig = null;\n   \n   function renderPlot() {\n       if (fig === null) {\n           const plotSpec = {\n\u0026quot;data\u0026quot;:{\n},\n\u0026quot;mapping\u0026quot;:{\n\u0026quot;x\u0026quot;:\u0026quot;gap\u0026quot;\n},\n\u0026quot;data_meta\u0026quot;:{\n\u0026quot;series_annotations\u0026quot;:[{\n\u0026quot;type\u0026quot;:\u0026quot;int\u0026quot;,\n\u0026quot;column\u0026quot;:\u0026quot;gap\u0026quot;\n}]\n},\n\u0026quot;ggtitle\u0026quot;:{\n\u0026quot;text\u0026quot;:\u0026quot;Distribution of words between Savior name references\u0026quot;,\n\u0026quot;subtitle\u0026quot;:\u0026quot;Book of Mormon  |  mean = 25.5 words (red dashed)  |  gaps \u003E 150 trimmed\u0026quot;\n},\n\u0026quot;guides\u0026quot;:{\n\u0026quot;x\u0026quot;:{\n\u0026quot;title\u0026quot;:\u0026quot;Words between consecutive references\u0026quot;\n},\n\u0026quot;y\u0026quot;:{\n\u0026quot;title\u0026quot;:\u0026quot;Count\u0026quot;\n}\n},\n\u0026quot;theme\u0026quot;:{\n\u0026quot;name\u0026quot;:\u0026quot;minimal\u0026quot;\n},\n\u0026quot;ggsize\u0026quot;:{\n\u0026quot;width\u0026quot;:700.0,\n\u0026quot;height\u0026quot;:400.0\n},\n\u0026quot;kind\u0026quot;:\u0026quot;plot\u0026quot;,\n\u0026quot;scales\u0026quot;:[],\n\u0026quot;layers\u0026quot;:[{\n\u0026quot;geom\u0026quot;:\u0026quot;histogram\u0026quot;,\n\u0026quot;mapping\u0026quot;:{\n},\n\u0026quot;data_meta\u0026quot;:{\n},\n\u0026quot;binwidth\u0026quot;:5.0,\n\u0026quot;fill\u0026quot;:\u0026quot;#378ADD\u0026quot;,\n\u0026quot;color\u0026quot;:\u0026quot;white\u0026quot;,\n\u0026quot;size\u0026quot;:0.3,\n\u0026quot;data\u0026quot;:{\n\u0026quot;..count..\u0026quot;:[224.0,1947.0,1626.0,1316.0,1015.0,801.0,589.0,528.0,412.0,331.0,268.0,209.0,194.0,136.0,93.0,83.0,89.0,76.0,50.0,57.0,45.0,28.0,27.0,27.0,21.0,15.0,16.0,15.0,14.0,13.0,4.0,0.0],\n\u0026quot;gap\u0026quot;:[-1.0,4.0,9.0,14.0,19.0,24.0,29.0,34.0,39.0,44.0,49.0,54.0,59.0,64.0,69.0,74.0,79.0,84.0,89.0,94.0,99.0,104.0,109.0,114.0,119.0,124.0,129.0,134.0,139.0,144.0,149.0,154.0]\n}\n},{\n\u0026quot;geom\u0026quot;:\u0026quot;vline\u0026quot;,\n\u0026quot;mapping\u0026quot;:{\n},\n\u0026quot;data_meta\u0026quot;:{\n},\n\u0026quot;xintercept\u0026quot;:25.539771627636927,\n\u0026quot;color\u0026quot;:\u0026quot;#E24B4A\u0026quot;,\n\u0026quot;linetype\u0026quot;:\u0026quot;dashed\u0026quot;,\n\u0026quot;size\u0026quot;:1.2,\n\u0026quot;data\u0026quot;:{\n}\n}],\n\u0026quot;metainfo_list\u0026quot;:[],\n\u0026quot;spec_id\u0026quot;:\u0026quot;2\u0026quot;\n};\n           fig = LetsPlot.buildPlotFromProcessedSpecs(plotSpec, containerDiv, sizing);\n       } else {\n           fig.updateView({});\n       }\n   }\n   \n   const renderImmediately = \n       forceImmediateRender || (\n           sizing.width_mode === 'FIXED' \u0026amp;\u0026amp; \n           (sizing.height_mode === 'FIXED' || sizing.height_mode === 'SCALED')\n       );\n   \n   if (renderImmediately) {\n       renderPlot();\n   }\n   \n   if (!renderImmediately || responsive) {\n       // Set up observer for initial sizing or continuous monitoring\n       var observer = new ResizeObserver(function(entries) {\n           for (let entry of entries) {\n               if (entry.contentBoxSize \u0026amp;\u0026amp; \n                   entry.contentBoxSize[0].inlineSize \u003E 0) {\n                   if (!responsive \u0026amp;\u0026amp; observer) {\n                       observer.disconnect();\n                       observer = null;\n                   }\n                   renderPlot();\n                   if (!responsive) {\n                       break;\n                   }\n               }\n           }\n       });\n       \n       observer.observe(containerDiv);\n   }\n   \n   // ----------\n   })();\n   \n   \u0026lt;/script\u003E\n   \u0026lt;/body\u003E\n\u0026lt;/html\u003E\"\u003E\u003C/iframe\u003E    "}, "type": "data"}]}, {"code_hash": "ebbbb07aa17332a6ae0df91765dd7f3d", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"6-summary\"\u003E6. Summary\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "580b7038fd450892009f515d7ccef0b8", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAcross the Book of Mormon's 6,604 verses, we found \u003Cstrong\u003E10,334 word-gaps\u003C/strong\u003E\nbetween consecutive references to the Savior, using \u003Cstrong\u003E112 distinct names and\ntitles\u003C/strong\u003E for Christ. The \u003Cstrong\u003Eaverage gap is 25.5 words\u003C/strong\u003E, with a median of\njust \u003Cstrong\u003E17 words\u003C/strong\u003E \u2014 meaning more than half of all reference-to-reference\nspans are shorter than three typical sentences.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe distribution is strongly right-skewed: most gaps cluster under 30 words, but\na long tail extends past 500 words in narrative-heavy stretches like the war\nchapters of Alma and Helaman. This confirms and extends Susan Easton Black's 1978\nfinding \u2014 while she reported a reference every 1.7 verses, the word-level metric\nshows readers encounter a Savior reference roughly every \u003Cstrong\u003E26 words\u003C/strong\u003E,\nor every two to three sentences.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.4", "script_metadata_hash": null}, "version": "1"},
