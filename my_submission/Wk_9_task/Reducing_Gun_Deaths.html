      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "9134d181e642cb1150016e67a718b79d", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "b6ee20d515dd3f03e3496322988f0185", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe following analysis uses Polars for high-performance data manipulation and Lets-Plot for presentation-quality visualizations to fulfill the requirements for Case Study 4.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003ESummary of the FiveThirtyEight Articl\u003C/strong\u003Ee\nThe FiveThirtyEight article, \"Gun Deaths in America,\" moves beyond the surface-level statistics of gun violence to reveal that the issue is composed of several distinct demographic trends. By analyzing approximately 33,000 annual deaths, they highlight that suicides are the leading cause of gun mortality, primarily affecting older white men, followed by homicides, which disproportionately impact young Black men. Their interactive visualization allows readers to see that while mass shootings often dominate public discourse, they represent a small fraction of the total lives lost.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ECore Insight Visualization\u003C/strong\u003E (Polars \u0026amp; Lets-Plot)\nThis plot mirrors the primary takeaway of the original article: the distribution of gun deaths by intent.\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "65b4794c752fbc195cc1e59476c71f87", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "            \u003Ciframe src='about:blank' style='border:none !important;' width='600' height='400' srcdoc=\"\u0026lt;html lang=\u0026quot;en\u0026quot;\u003E\n   \u0026lt;head\u003E\n       \u0026lt;meta charset=\u0026quot;UTF-8\u0026quot;\u003E\n       \u0026lt;style\u003E html, body { margin: 0; lower in winter, December shows a distinct rise in homicides compared to the months surrounding it.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EConsistent Suicide Risk: Suicides remain the dominant cause of death every month, but show slight increases during the spring and mid-summer.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b2b717ae9854b710b7e37fee013a97c8", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Col start=\"5\"\u003E\n\u003Cli\u003E\u003Cstrong\u003EPotential Group Targetings\u003C/strong\u003E (Seasonal Visualizations)\nPlot 1: Total Seasonal Deaths by Month\nThis plot identifies the months where the client should spend the most on commercial airtime.\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5682563e339d84f825745f14b2863ac1", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "            \u003Ciframe src='about:blank' style='border:none !important;' width='600' height='400' srcdoc=\"\u0026lt;html lang=\u0026quot;en\u0026quot;\u003E\n   \u0026lt;head\u003E\n       \u0026lt;meta charset=\u0026quot;UTF-8\u0026quot;\u003E\n       \u0026lt;style\u003E html, body { margin: 0; padding: 0; overflow: hidden; } \u0026lt;/style\u003E\n       \u0026lt;script type=\u0026quot;text/javascript\u0026quot; data-lets-plot-script=\u0026quot;library\u0026quot; src=\u0026quot;https://cdn.jsdelivr.net/gh/JetBrains/lets-plot@v4.9.0/js-package/distr/lets-plot.min.js\u0026quot;\u003E\u0026lt;/script\u003E\n   \u0026lt;/head\u003E\n   \u0026lt;body\u003E\n          \u0026lt;div id=\u0026quot;Eyoz1f\u0026quot; \u003E\u0026lt;/div\u003E\n   \u0026lt;script type=\u0026quot;text/javascript\u0026quot; data-lets-plot-script=\u0026quot;plot\u0026quot;\u003E\n   \n   (function() {\n   // ----------\n   \n   const forceImmediateRender = false;\n   const responsive = false;\n   \n   let sizing = {\n
