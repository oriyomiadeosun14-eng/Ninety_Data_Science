      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

            "session": {"cells": [{"code_hash": "1d0db38904205bec4d6f6f6a1f6cec3e", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "6c6e9b7162455da7d9dff80774804780", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "05ea3bafd1c95d2988b15f63a634266a", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"cs-06-the-collapse-of-construction-in-idaho\"\u003E\ud83c\udfd7\ufe0f CS-06: The Collapse of Construction in Idaho\u003C/h1\u003E\n\u003Ch3 id=\"idaho-restaurant-commission-2008-2009-building-permit-analysis\"\u003EIdaho Restaurant Commission \u2014 2008 \u0026amp; 2009 Building Permit Analysis\u003C/h3\u003E\n\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003EIt is 2010. Idaho's construction sector has just lived through one of its\nworst downturns in decades. The Restaurant Commission has asked us to make\nsense of two years of commercial building permits \u2014 1,248 projects across\nevery Idaho county \u2014 and answer four specific questions about what happened\nto restaurant construction during that period.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe four questions we answer:\u003C/strong\u003E\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EHow did full-service restaurant construction compare to quick-service across county and year?\u003C/li\u003E\n\u003Cli\u003EHow did restaurant construction fare compared to all other commercial construction?\u003C/li\u003E\n\u003Cli\u003EWhich county spent the most on fast-food construction each year?\u003C/li\u003E\n\u003Cli\u003EIn that county, how did other commercial construction compare?\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EData sources:\u003C/strong\u003E \u003Ccode\u003Ebuildings0809\u003C/code\u003E, \u003Ccode\u003Erestaurants\u003C/code\u003E, \u003Ccode\u003Eclimate_zone_fips\u003C/code\u003E, \u003Ccode\u003Epermits\u003C/code\u003E\nfrom the \u003Ca href=\"https://github.com/hathawayj/buildings\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ehathawayj/buildings\u003C/a\u003E R package.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c4ff5257a9d9d2660d22884e765c7077", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"step-1-load-inspect-the-data\"\u003E\ud83d\udce6 Step 1 \u2014 Load \u0026amp; Inspect the Data\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a0fa5734b0c1fd442c7e6f82c8c79ed6", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "38e5079c2506eb3c9bf09c0a81ad777f", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EBuildings dataset:\u003C/strong\u003E 1,248 rows \u00d7 20 columns\ncovering Idaho commercial construction permits in 2008 and 2009.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ERestaurants dataset:\u003C/strong\u003E 487 rows \u2014 a lookup table mapping\nrestaurant chain names to dining categories\n(Fast Food, Casual Dining, Pizza, coffee, Ice Cream, Fast Casual).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EKey columns in \u003Ccode\u003Ebuildings\u003C/code\u003E:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EProjectTitle\u003C/code\u003E \u2014 free-text name of the project (where regex is needed!)\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EType\u003C/code\u003E \u2014 building category; we focus on \u003Ccode\u003EFood_Beverage_Service\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ESqFt\u003C/code\u003E \u2014 square footage (used for fallback size-based classification)\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EValue1000\u003C/code\u003E \u2014 construction value in thousands of dollars\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ECounty\u003C/code\u003E, \u003Ccode\u003EYear\u003C/code\u003E\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9bf8cbed8b3dd800b42494afa1d04a83", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"step-2-clean-standardise\"\u003E\ud83e\uddf9 Step 2 \u2014 Clean \u0026amp; Standardise\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "260000ce29675c13e9c1430678634ab9", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "2b631a91a9a159df4cc8f465b88b356b", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ECounty names arrived as \u003Ccode\u003E\"ADA, ID\"\u003C/code\u003E, \u003Ccode\u003E\"BANNOCK, ID\"\u003C/code\u003E etc.\nA simple regex \u2014 \u003Ccode\u003Er\",\\s*ID$\"\u003C/code\u003E \u2014 strips the state suffix and\n\u003Ccode\u003Estr.to_titlecase()\u003C/code\u003E converts to \u003Ccode\u003E\"Ada\"\u003C/code\u003E, \u003Ccode\u003E\"Bannock\"\u003C/code\u003E.\nClean labels, zero manual editing.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6aa6ac3bede1d058ee3e5f3ce75a243a", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"step-3-classify-restaurant-types\"\u003E\ud83d\udd0d Step 3 \u2014 Classify Restaurant Types\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe \u003Ccode\u003EFood_Beverage_Service\u003C/code\u003E building type is a mixed bag \u2014 it includes\nschool cafeterias, bakeries, and retail food outlets alongside actual\nrestaurants. We need to:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EExclude\u003C/strong\u003E non-restaurants (cafeterias, schools, warehouses, etc.)\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMatch\u003C/strong\u003E known chain names from the \u003Ccode\u003Erestaurants\u003C/code\u003E lookup table\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMatch\u003C/strong\u003E keyword patterns in \u003Ccode\u003EProjectTitle\u003C/code\u003E using \u003Cstrong\u003Eregex\u003C/strong\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EApply fallback rules\u003C/strong\u003E based on square footage for anything remaining\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EClassification priority order:\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ENot-restaurant keywords  \u2192  excluded\nStandalone retail        \u2192  excluded\nKnown QS chain names     \u2192  Quick Service\nKnown FS chain names     \u2192  Full Service\nQS keyword patterns      \u2192  Quick Service\nFS keyword patterns      \u2192  Full Service\nSqFt \u2265 4,000             \u2192  Full Service  (fallback)\nSqFt \u0026gt; 0 \u0026amp; \u0026lt; 4,000       \u2192  Quick Service (fallback)\nOtherwise                \u2192  Unknown\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "43d3d030ab6baed6beb1068ca027bdac", "console": [], "id": "Kclp", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "1c28761ea468a1a3a447f999b2c021b1", "console": [], "id": "emfo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ed0f3ac0e2f4f662919d0d612ee1719a", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EClassification results across 87 Food \u0026amp; Beverage buildings:\u003C/strong\u003E\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ECategory\u003C/th\u003E\n\u003Cth\u003ECount\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EQuick Service\u003C/td\u003E\n\u003Ctd\u003E35\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EUnknown\u003C/td\u003E\n\u003Ctd\u003E21\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EFull Service\u003C/td\u003E\n\u003Ctd\u003E19\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ENot Restaurant\u003C/td\u003E\n\u003Ctd\u003E12\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E21 \"Unknown\"\u003C/strong\u003E entries are generic titles like \u003Cem\u003E\"Restaurant (Alteration)\"\u003C/em\u003E\nwith zero square footage \u2014 no keyword or name matched, and no size data\nto fall back on. These are included in restaurant totals where relevant\nbut excluded from the Full/Quick comparison to avoid noise.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5861c87a28c9ade3f7d757de8d7c75cc", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Ch2 id=\"question-1\"\u003E\ud83d\udcca Question 1\u003C/h2\u003E\n\u003Ch3 id=\"how-did-full-service-restaurant-construction-compare-to-quick-service-across-county-and-year\"\u003EHow did full-service restaurant construction compare to quick-service across county and year?\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "170bb38959e727099e16cfaa2d7509c4", "console": [], "id": "iLit", "outputs": [{"data": {"text/html": "            \u003Ciframe src='about:blank' styl 026gt;\u0026#92;n  the second-place county (Canyon, \u0026#36;1,148K).\u0026lt;/li\u0026gt;\u0026#92;n\u0026lt;li\u0026gt;In 2009, Ada County still led with \u0026lt;strong\u0026gt;\u0026#36;1,114K\u0026lt;/strong\u0026gt;,\u0026#92;n  though total spend fell significantly as the economic downturn hit.\u0026lt;/li\u0026gt;\u0026#92;n\u0026lt;li\u0026gt;The concentration in Ada reflects its population density and the\u0026#92;n  presence of major commercial corridors in Boise, Meridian, and Nampa\u0026#92;n  \u2014 prime locations for national fast-food franchise expansion.\u0026lt;/li\u0026gt;\u0026#92;n\u0026lt;/ul\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-kind='\u0026quot;success\u0026quot;'\u003E\u003C/marimo-callout-output\u003E"}, "type": "data"}]}, {"code_hash": "992adb53121fd1c5dd552b289242591c", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Ch2 id=\"question-4\"\u003E\ud83d\udcca Question 4\u003C/h2\u003E\n\u003Ch3 id=\"in-that-county-how-did-other-commercial-construction-compare\"\u003EIn that county, how did other commercial construction compare?\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "14d63efa2ab0832065adb1d0c64a88e6", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/html": "            \u003Ciframe src='about:blank' style='border:none !important;' width='900' height='560' srcdoc=\"\u0026lt;html lang=\u0026quot;en\u0026quot;\u003E\n   \u0026lt;head\u003E\n       \u0026lt;meta charset=\u0026quot;UTF-8\u0026quot;\u003E\n       \u0026lt;style\u003E html, body { margin: 0; padding: 0; overflow: hidden; } \u0026lt;/style\u003E\n       \u0026lt;script type=\u0026quot;text/javascript\u0026quot; data-lets-plot-script=\u0026quot;library\u0026quot; src=\u0026quot;https://cdn.jsdelivr.net/gh/JetBrains/lets-plot@v4.9.0/js-package/distr/lets-plot.min.js\u0026quot;\u003E\u0026lt;/script\u003E\n   \u0026lt;/head\u0  or continuous monitoring\n       var observer = new ResizeObserver(function(entries) {\n           for (let entry of entries) {\n               if (entry.contentBoxSize \u0026amp;\u0026amp; \n                   entry.contentBoxSize[0].inlineSize \u003E 0) {\n                   if (!responsive \u0026amp;\u0026amp; observer) {\n                       observer.disconnect();\n                       observer = null;\n                   }\n                   renderPlot();\n                   if (!responsive) {\n                       break;\n                   }\n               }\n           }\n       });\n       \n       observer.observe(containerDiv);\n   }\n   \n   // ----------\n   })();\n   \n   \u0026lt;/script\u003E\n   \u0026lt;/body\u003E\n\u0026lt;/html\u003E\"\u003E\u003C/iframe\u003E    "}, "type": "data"}]}, {"code_hash": "cc2b1e83f8eadd259c6b593730d38f53", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/html": "\u003Cmarimo-callout-output data-html='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\u0026lt;strong\u0026gt;Key findings:\u0026lt;/strong\u0026gt;\u0026lt;/span\u0026gt;\u0026#92;n\u0026lt;ul\u0026gt;\u0026#92;n\u0026lt;li\u0026gt;In Ada County, \u0026lt;strong\u0026gt;Food \u0026amp;amp; Beverage\u0026lt;/strong\u0026gt; accounts for roughly\u0026#92;n  \u0026lt;strong\u0026gt;2.6%\u0026lt;/strong\u0026gt; of total commercial construction value\u0026#92;n  across both years \u2014 a meaningful but not dominant sector.\u0026lt;/li\u0026gt;\u0026#92;n\u0026lt;li\u0026gt;The \u0026lt;strong\u0026gt;Colleges Universities Except Com\u0026lt;/strong\u0026gt; sector dwarfs restaurants in absolute terms\u0026#92;n  (\u0026#36;80,602K combined), reflecting the broader mix\u0026#92;n  of commercial development happening in the Boise metro area.\u0026lt;/li\u0026gt;\u0026#92;n\u0026lt;li\u0026gt;The \u0026lt;strong\u0026gt;2009 collapse\u0026lt;/strong\u0026gt; is visible across \u0026lt;em\u0026gt;every\u0026lt;/em\u0026gt; sector \u2014 the blue\u0026#92;n  (2008) bars are consistently taller than the red (2009) bars.\u0026#92;n  This is not a restaurant story; it is an \u0026lt;strong\u0026gt;economy-wide story\u0026lt;/strong\u0026gt;.\u0026lt;/li\u0026gt;\u0026#92;n\u0026lt;li\u0026gt;The sectors that fell hardest were large-footprint commercial\u0026#92;n  projects \u2014 offices, stores, and shopping centres \u2014 which require\u0026#92;n  long-term financing commitments that dried up after the financial\u0026#92;n  crisis. Restaurants, being smaller and often franchise-driven,\u0026#92;n  were somewhat insulated.\u0026lt;/li\u0026gt;\u0026#92;n\u0026lt;li\u0026gt;\u0026lt;strong\u0026gt;Implication for the Commission:\u0026lt;/strong\u0026gt; the drop in restaurant\u0026#92;n  construction mirrors the broader market. Monitoring restaurant\u0026#92;n  construction as a share of total commercial building \u2014 rather\u0026#92;n  than in absolute terms \u2014 would give a cleaner signal of industry\u0026#92;n  health going forward.\u0026lt;/li\u0026gt;\u0026#92;n\u0026lt;/ul\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-kind='\u0026quot;neutral\u0026quot;'\u003E\u003C/marimo-callout-output\u003E"}, "type": "data"}]}, {"code_hash": "f2d45289aca0656adb25da04c8466f9f", "console": [], "id": "aLJB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Ch2 id=\"executive-summary\"\u003E\ud83d\udcdd Executive Summary\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe Idaho Restaurant Commission asked us to examine two years of commercial\nbuilding permits during a turbulent economic period. Here is what the data shows:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E1. Full Service vs Quick Service\u003C/strong\u003E\nAda County dominated both categories. Quick-service construction was\nhit harder in 2009, while full-service projects proved more resilient \u2014\nlikely because larger sit-down restaurant builds had longer lead times\nand were already committed before the downturn.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E2. Restaurants vs the broader market\u003C/strong\u003E\nRestaurants were a small fraction (~3\u20135%) of all commercial construction.\nBoth sectors declined sharply from 2008 to 2009, but restaurants did not\ncollapse disproportionately \u2014 the whole market contracted together.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E3. Fast-food investment concentration\u003C/strong\u003E\nAda County led fast-food construction spend in both years, by a wide\nmargin. The Boise\u2013Meridian corridor was the primary growth engine for\nfranchise quick-service expansion in Idaho.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E4. Ada County's construction landscape\u003C/strong\u003E\nWithin Ada, Food \u0026amp; Beverage sits in the middle of the sector pack.\nOffices and retail led construction volume. The 2009 decline was\nuniversal \u2014 every sector fell, not just restaurants.\u003C/span\u003E\n\u003Chr /\u003E\n\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EAnalysis produced for the Idaho Restaurant Commission, 2010.\u003C/em\u003E\n\u003Cem\u003EData: hathawayj/buildings R package. Tools: Polars \u00b7 Regex \u00b7 lets-plot \u00b7 Marimo.\u003C/em\u003E\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.3", "script_metadata_hash": null}, "version": "1"},
