[project]
name = "intro-datascience"
version = "0.1.0"
description = "Beginner-friendly introduction to data science for Johannesburg SA 2026 trainings"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "marimo>=0.23.3",
    "polars>=0.20.0",
    "plotly>=5.18.0",
    "pyzmq>=27.1.0",
    "statsmodels>=0.14.6",
    "gapminder>=0.1",
    "setuptools<=70",
    "pyarrow>=23.0.1",
    "kaleido>=1.2.0",
    "lets-plot>=4.9.0",
    "palmerpenguins>=0.1.6",
    "matplotlib>=3.10.9",
    "matplotlib-inline>=0.2.1",
    "ipython>=9.13.0",
    "dbfread>=2.0.7",
    "pyreadr>=0.5.6",
    "pycountry>=26.2.16",
]
